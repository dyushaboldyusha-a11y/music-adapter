<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Liberty · Музыкальный виджет</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 11 7-11 7Z" fill="currentColor" stroke="none"/><path d="M18 5v14" stroke-width="2.8"/></symbol>
    <symbol id="i-previous" viewBox="0 0 24 24"><path d="m19 5-11 7 11 7Z" fill="currentColor" stroke="none"/><path d="M6 5v14" stroke-width="2.8"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h2c6 0 8 12 14 12h2m-4-4 4 4-4 4M3 18h2c2.2 0 4-1.8 5.5-4.2M14 8.2C15.6 6.7 17.2 6 19 6h2m-4-4 4 4-4 4"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m16 2 4 4-4 4M4 11V9a3 3 0 0 1 3-3h13M8 22l-4-4 4-4m12-1v2a3 3 0 0 1-3 3H4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="4" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="20" cy="12" r="1.7" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3m12-6 3 3-3 3"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="5.5" cy="18.5" rx="3.5" ry="2.5"/><ellipse cx="16.5" cy="16.5" rx="3.5" ry="2.5"/></symbol>
  </svg>
  <main class="widget" id="widget" aria-label="Музыкальный виджет Liberty">
    <div class="widget-surface" aria-hidden="true"></div>
    <svg class="edge-waves" viewBox="0 0 616 234" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <mask id="outside-frame" maskUnits="userSpaceOnUse" x="0" y="0" width="616" height="234">
          <rect width="616" height="234" fill="white"/>
          <rect x="16" y="16" width="584" height="202" rx="19" fill="black"/>
        </mask>
        <path id="edge-wave-ring" d="M36 9C102 2 160 13 230 8S350 2 420 8S530 14 580 9Q608 7 607 36C612 90 602 145 608 192Q611 226 579 226C510 231 456 220 386 226S260 232 192 226S86 221 36 226Q7 229 9 194C3 138 14 90 9 40Q5 6 36 9Z"/>
      </defs>
      <g mask="url(#outside-frame)">
        <use class="wave-glow" href="#edge-wave-ring"/>
        <use class="edge-wave" href="#edge-wave-ring"/>
      </g>
    </svg>
    <div class="drag-surface" aria-hidden="true"></div>
    <div class="artwork-column">
      <div class="cover" id="cover">
        <img id="artwork" alt="Обложка альбома" hidden>
        <div class="cover-placeholder" id="cover-placeholder"><svg><use href="#i-music"/></svg></div>
        <span class="cover-shine"></span>
      </div>
      <span class="signature">Liberty</span>
    </div>
    <section class="player" aria-label="Воспроизведение">
      <div class="track-row">
        <div class="track-info">
          <h1 id="title">Liberty</h1>
          <p id="artist">Включите музыку в любом плеере</p>
        </div>
        <button class="icon-button more" id="menu" aria-label="Настройки виджета" title="Настройки"><svg><use href="#i-more"/></svg></button>
      </div>
      <div class="timeline">
        <input type="range" id="seek" min="0" max="1" step="0.1" value="0" aria-label="Позиция воспроизведения" disabled>
        <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      </div>
      <div class="controls">
        <button class="icon-button secondary" id="shuffle" aria-label="Перемешивание" aria-pressed="false" disabled><svg><use href="#i-shuffle"/></svg></button>
        <button class="icon-button transport" id="previous" aria-label="Предыдущий трек" disabled><svg><use href="#i-previous"/></svg></button>
        <button class="play-button" id="play-pause" aria-label="Воспроизвести" disabled><svg><use id="play-icon" href="#i-play"/></svg></button>
        <button class="icon-button transport" id="next" aria-label="Следующий трек" disabled><svg><use href="#i-next"/></svg></button>
        <button class="icon-button secondary" id="repeat" aria-label="Повтор" aria-pressed="false" disabled><svg><use href="#i-repeat"/></svg><span class="repeat-one" id="repeat-one" hidden>1</span></button>
      </div>
    </section>
    <section id="pairing" class="pairing-panel" role="dialog" aria-label="Подключить браузер" hidden>
      <h2>Подключить браузер</h2><p>Установите расширение Liberty и введите в нём этот код:</p>
      <strong id="pair-code"></strong><p class="pair-expiry">Код действует 5 минут</p>
      <div><button id="copy-code">Скопировать код</button><button id="close-pair">Закрыть</button></div>
    </section>
  </main>
  <footer class="widget-footer">
    <label class="source-picker"><span class="source-dot" aria-hidden="true"></span><select id="source" aria-label="Источник музыки"><option value="auto">Автоматически</option></select></label>
    <button id="pair-browser" class="pair-button" aria-label="Подключить браузер" title="Подключить браузер">＋</button>
    <span class="demo-label" id="demo-label" hidden>ДЕМО</span>
    <span class="mode-hint" id="mode-hint"><svg><use href="#i-move"/></svg><span id="mode-text">Перетащите за обложку или название</span><kbd>Num 8</kbd><span id="key-hint">закрепить</span></span>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
