name: Liberty Wave — Windows application
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the validated Windows executable to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && 'release' || 'checks' }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag does not match package.json' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run voice:prepare
      - name: Check bundled Russian and English recognition without SAPI
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File native/windows-automation.ps1 -CheckSamples test/fixtures/voice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File native/windows-automation.ps1 -CheckSamples test/fixtures/voice-wake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm test
      - name: Check Inset Glass in Windows Electron
        run: npm run test:glass
      - name: Check Windows integrations
        shell: pwsh
        run: |
          npm run check:windows 2>&1 | Tee-Object -FilePath windows-check.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $details = (Get-Content windows-check.log -Tail 45) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows integration failure::$details"
            exit $code
          }
      - run: npm run test:update-network
      - run: npm run dist:win
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
      - run: npm run check:branding
      - name: Check packaged voice helper
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File release/win-unpacked/resources/native/windows-automation.ps1 -CheckSamples test/fixtures/voice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File release/win-unpacked/resources/native/windows-automation.ps1 -CheckSamples test/fixtures/voice-wake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check voice engine under a Unicode path
        shell: pwsh
        run: |
          Copy-Item -LiteralPath release/win-unpacked/resources/native -Destination 'artifacts/Голос с пробелами' -Recurse
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'artifacts/Голос с пробелами/windows-automation.ps1' -CheckSamples test/fixtures/voice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'artifacts/Голос с пробелами/windows-automation.ps1' -CheckSamples test/fixtures/voice-wake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package browser connector
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path browser-extension/* -DestinationPath "release/Liberty-Wave-Browser-Connector-$version.zip"
      - name: Generate checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = Get-Item "release/Liberty-Wave-$version-Windows.exe", "release/Liberty-Wave-Browser-Connector-$version.zip"
          $lines = foreach ($file in $files) { $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($file.Name)" }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Liberty-Wave-Windows
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - name: Prepare Electron sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run test:gui
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:automation
      - run: xvfb-run -a npm run test:update-network
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:settings
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:control
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:startup
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:features
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:playback
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:glass
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:wave-fixes
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:music-effects
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:personalization
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:tab-wave
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:browser
  release:
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [windows, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Liberty-Wave-Windows
          path: release
      - name: Upload and publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          asset="release/Liberty-Wave-$version-Windows.exe"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Liberty Wave $version" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$tag" "$asset" "release/Liberty-Wave-Browser-Connector-$version.zip" release/SHA256SUMS.txt --clobber
          gh release edit "$tag" --target "$GITHUB_SHA" --title "Liberty Wave $version" --notes-file docs/RELEASE_NOTES.md --draft=false --latest
