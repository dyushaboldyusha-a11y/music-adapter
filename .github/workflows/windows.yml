name: Windows application
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the validated Windows executable to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:windows
      - run: npm run dist:win
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
      - name: Package browser connector
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path browser-extension/* -DestinationPath "release/Liberty-Browser-Connector-$version.zip"
      - name: Generate checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = Get-Item "release/Music-Adapter-$version-Windows.exe", "release/Liberty-Browser-Connector-$version.zip"
          $lines = foreach ($file in $files) { $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($file.Name)" }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Adapter-Windows
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - name: Prepare Electron sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run test:gui
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:settings
      - run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' npm run test:browser
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [windows, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Music-Adapter-Windows
          path: release
      - name: Upload and publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          asset="release/Music-Adapter-$version-Windows.exe"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Music Adapter $version" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$tag" "$asset" "release/Liberty-Browser-Connector-$version.zip" release/SHA256SUMS.txt --clobber
          gh release edit "$tag" --target "$GITHUB_SHA" --title "Music Adapter $version — Liberty" --notes-file docs/RELEASE_NOTES.md --draft=false --latest
